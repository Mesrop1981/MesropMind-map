name: Build MesMind-Map Windows

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Клонирование репозитория
        uses: actions/checkout@v4

      - name: Установка Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Установка зависимостей
        run: |
          npm install --legacy-peer-deps

      - name: Сборка веб-интерфейса
        run: |
          npm run build --if-present

      - name: Компиляция установщика Windows
        run: |
          npx electron-builder --win --config.win.target=nsis

      - name: Сохранение готового установщика
        uses: actions/upload-artifact@v4
        with:
          name: MesMind-Map-1.0-Installer
          path: dist/*.exe
