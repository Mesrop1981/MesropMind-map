name: Build MesMind-Map Windows

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Клонирование репозитория
        uses: actions/checkout@v4

      - name: Установка Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Сборка библиотеки ядра
        run: |
          cd simple-mind-map
          npm install --legacy-peer-deps
          npm run build --if-present

      - name: Сборка русского веб-интерфейса
        run: |
          cd web
          npm install --legacy-peer-deps
          npm run build

      - name: Создание точки входа Electron
        run: |
          @'
          const { app, BrowserWindow } = require('electron');
          const path = require('path');

          function createWindow() {
            const win = new BrowserWindow({
              width: 1400,
              height: 900,
              title: "MesMind-Map 1.0",
              webPreferences: {
                nodeIntegration: true,
                contextIsolation: false
              }
            });
            win.loadFile(path.join(__dirname, 'dist', 'index.html'));
          }

          app.whenReady().then(createWindow);
          app.on('window-all-closed', () => {
            if (process.platform !== 'darwin') app.quit();
          });
          '@ | Set-Content -Path web\main.js

      - name: Компиляция установщика Windows
        run: |
          cd web
          npm install -D electron electron-builder
          npx electron-builder --win nsis --config.productName="MesMind-Map 1.0" --config.appId="com.mesmind.map" --config.directories.output="dist-electron" --config.extraMetadata.main="main.js"

      - name: Выгрузка готового установщика
        uses: actions/upload-artifact@v4
        with:
          name: MesMind-Map-1.0-Installer
          path: web/dist-electron/*.exe
