name: Build MesMind-Map Windows

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Клонирование репозитория
        uses: actions/checkout@v4

      - name: Установка Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Сборка веб-интерфейса
        working-directory: ./web
        run: |
          npm install --legacy-peer-deps
          npm run build

      - name: Упаковка в Windows EXE (Electron)
        working-directory: ./web
        run: |
          npm install -D electron electron-builder
          npx electron-builder --win nsis --config.productName="MesMind-Map 1.0" --config.appId="com.mesmind.map" --config.directories.output="dist-electron"

      - name: Сохранение установщика
        uses: actions/upload-artifact@v4
        with:
          name: MesMind-Map-1.0-Installer
          path: web/dist-electron/*.exe
